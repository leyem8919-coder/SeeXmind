name: Verify and publish distribution
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify and assemble the public distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const m=require("./manifest.json"); if(m.version!==process.env.RELEASE_TAG || m.id!=="seexmind") process.exit(1)'
          sha256sum --check SHA256SUMS
          mkdir release
          cp main.js manifest.json styles.css release/
      # This attests assembly from the public distribution commit, NOT compilation
      # of private source. Obsidian independently verifies the matching private tag.
      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release/*'
      - name: Publish the three Obsidian installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/main.js release/manifest.json release/styles.css --verify-tag --title "SeeXmind $RELEASE_TAG" --notes-file RELEASE_NOTES.md
